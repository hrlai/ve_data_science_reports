name: Weekly soil report draft

on:
  schedule:
    # Every Monday at 09:00 SGT/MYT (UTC+8 = 01:00 UTC)
    - cron: "0 1 * * MON"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: weekly-soil-report-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::gh
            any::dplyr
            any::purrr
            any::lubridate
            any::glue
            any::ellmer
            any::here

      # GOOGLE_API_KEY must be stored in GitHub repository secrets
      - name: Draft report overview sections
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: Rscript .github/scripts/draft_overview.R

      - name: Create branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add docs/soil_progress_report.qmd

          if git diff --cached --quiet; then
            echo "No changes, skipping PR creation."
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          BRANCH="chore/weekly-soil-report-draft-${DATE}"
          git checkout -b "${BRANCH}"
          git commit -m "chore: weekly soil report draft – ${DATE} [skip ci]"
          git push origin "${BRANCH}"
          gh pr create \
            --title "chore: weekly soil report draft – ${DATE}" \
            --body "Automated weekly draft generated by the weekly soil report workflow." \
            --base main \
            --head "${BRANCH}"
