name: Weekly soil report draft

on:
  schedule:
    # Every Monday at 09:00 SGT/MYT (UTC+8 = 01:00 UTC)
    - cron: "0 1 * * MON"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: weekly-soil-report-draft-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::gh
            any::dplyr
            any::purrr
            any::lubridate
            any::glue
            any::ellmer
            any::here

      # GOOGLE_API_KEY must be stored in GitHub repository secrets
      - name: Draft report overview sections
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: Rscript .github/scripts/draft_overview.R

      - name: Commit and push to draft branch
        id: push_draft
        run: |
          # Always reset the draft branch so skipped weeks don't break automation
          git fetch origin
          if git ls-remote --exit-code --heads origin chore/weekly-soil-draft; then
            git push origin --delete chore/weekly-soil-draft
          fi

          git checkout -b chore/weekly-soil-draft
          git add docs/soil_progress_report.qmd

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes, skipping push and PR."
            exit 0
          fi

          git commit -m "chore: update report overview sections [skip ci]"
          git push origin chore/weekly-soil-draft
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Open or update PR against main
        if: steps.push_draft.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)

          EXISTING_PR_URL=$(gh pr list \
            --base main \
            --head chore/weekly-soil-draft \
            --state open \
            --json url \
            --jq '.[0].url')

          if [ -n "$EXISTING_PR_URL" ]; then
            echo "Open PR already exists: $EXISTING_PR_URL"
            exit 0
          fi

          gh pr create \
            --base main \
            --head chore/weekly-soil-draft \
            --title "chore: weekly soil report draft – ${DATE}" \
            --body "This is an automated draft to remind you to update the weekly soil report.

          ## What was updated
          The **\"Lastest description\"** and **\"Required elements (Waiting for)\"** sections in
          \`docs/soil_progress_report.qmd\` have been rewritten automatically as of ${DATE}.
          The description was drafted by an LLM (Google Gemini) based on recent GitHub activity.
          The waiting-for bullets were generated deterministically from open PRs with pending reviewers.

          ## What still needs your attention
          Please manually review and edit:
          - [ ] **Lastest description** — verify the LLM-drafted summary is accurate
          - [ ] **Required elements** — review and edit the auto-generated bullets if needed
          - [ ] **Additional notes** — anything else worth noting

          Once done, merge this PR to keep \`main\` up to date.
          The site will be re-rendered and deployed to GitHub Pages automatically."
